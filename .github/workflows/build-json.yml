name: Build dataset from exports

on:
  workflow_dispatch: {}         # allows manual runs from Actions tab
  push:
    paths:
      - 'exports/**'            # auto-run whenever files in exports/ change

permissions:
  contents: write               # let the Action commit the new JSON

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Build widget_dataset.json
        run: python build_dataset.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add widget_dataset.json
          git commit -m "auto: rebuild widget_dataset.json from exports" || echo "No changes to commit"
          git push
